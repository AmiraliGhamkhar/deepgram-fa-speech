name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# No real Deepgram credentials are used anywhere in this workflow. All
# provider/network interaction is mocked (see tests/test_streaming.py,
# tests/test_app.py) so the test suite never opens a real connection.
env:
  DEEPGRAM_API_KEY: ""

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system audio dependency (for sounddevice import)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit + regression tests
        run: pytest tests/ -v --cov=medical_stt --cov-report=term-missing

      - name: Lint (ruff)
        run: ruff check medical_stt tests scripts

      - name: Type check (mypy)
        run: mypy medical_stt

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
