[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Keep the linted rule set focused on real correctness issues (unused
# imports/variables, undefined names, obvious bugs) rather than the full
# opinionated style rule set, per "do not add unnecessary frameworks" /
# keep the project lightweight.
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["tests/", "scripts/"]
# host/ has no __init__.py -- cPanel copies it as a flat directory, so its
# modules must also import as top-level names. Without explicit bases mypy
# refuses the package-relative imports in host/app.py and
# host/passenger_wsgi.py ("No parent module -- cannot perform relative
# import") and silently checks nothing.
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
# These modules support both import layouts at once: package-relative in a
# full checkout, flat top-level when only host/ is deployed. Each fallback
# branch is therefore a redefinition when the relative import resolves, and an
# unresolvable module when it does not -- in either mode one of the two
# diagnostics is spurious, and the `type: ignore[no-index]` comments that are
# load-bearing in flat mode read as unused in package mode. `attr-defined`
# covers a third spurious diagnostic: in package mode mypy resolves the bare
# `config`/`identity`/... names of the flat branch to no real module and flags
# every name pulled through them. Exactly these three codes are disabled, and
# only for these modules; the package-relative branch is still fully checked,
# and every other host module (e.g. `host/provision.py`, `host/metrics.py`) is
# checked in full.
module = [
    "host.app",
    "host.config",
    "host.core",
    "host.grant",
    "host.hardening",
    "host.identity",
    "host.limits",
    "host.passenger_wsgi",
    "host.ratelimit",
    "host.request_guard",
    "host.session_service",
]
disable_error_code = ["no-redef", "unused-ignore", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to the real Deepgram service; disabled unless MEDICAL_STT_LIVE_TEST=1",
    "soak: long-running 50-client soak; disabled unless MEDICAL_STT_SOAK=1",
    "loadtest: real Deepgram concurrent-stream load test; disabled unless MEDICAL_STT_LOAD_TEST=1",
]
