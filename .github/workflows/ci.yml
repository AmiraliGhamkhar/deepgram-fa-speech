name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# No real Deepgram credentials are used anywhere in this workflow. All
# provider/network interaction is mocked (see tests/test_streaming.py,
# tests/test_app.py) so the test suite never opens a real connection.
env:
  DEEPGRAM_API_KEY: ""

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system audio dependency (for sounddevice import)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        # host/requirements-dev.txt is installed here too, on purpose. Several
        # host suites (test_host_app.py, test_audit_fixes.py,
        # test_host_concurrency.py) begin with pytest.importorskip("fastapi"),
        # so with only the client dependencies installed they skipped *whole
        # modules* and this job still reported green. The step below fails the
        # build if that ever happens again.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r host/requirements-dev.txt

      - name: Run unit + regression tests
        shell: bash
        run: |
          set -o pipefail
          pytest tests/ -v -rs --cov=medical_stt --cov-report=term-missing 2>&1 | tee pytest.log

      - name: Fail if any suite was skipped for a missing dependency
        shell: bash
        run: |
          # importorskip turns an uninstalled package into a silent green job.
          # The only skips this repository allows are the environment-gated
          # live/load/soak suites, whose reasons never mention an import, so
          # any "could not import" line means a suite did not run at all.
          if grep -E "could not import" pytest.log; then
            echo "::error title=Suite silently skipped::A test module was skipped because a dependency is missing from the install step above."
            exit 1
          fi

      - name: Lint (ruff)
        # Whole repository: `benchmarks/` and `run.py` were outside the
        # previous path list, so a W292 in run.py went unnoticed.
        run: ruff check .

      - name: Type check (mypy)
        # host/app.py, host/metrics.py, host/provision.py and
        # host/passenger_wsgi.py were outside the previous invocation -- which
        # is how four stale `type: ignore` comments survived there. `host` is
        # checked as a package (see explicit_package_bases in pyproject.toml);
        # naming the files individually makes mypy reject the package-relative
        # imports and check nothing.
        run: mypy medical_stt host benchmarks

  host-test:
    name: Host service + 50-client concurrency
    runs-on: ubuntu-latest
    # Proves host/core.py's auth, client registry, rate limiting, TTL clamping
    # and Deepgram grant logic -- and that 50 simultaneous clients are served.
    # The Deepgram grant is stubbed at the async transport, so no key and no
    # network access are required and no credit is ever spent.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # host/requirements-dev.txt brings in fastapi/httpx/uvicorn so the
        # ASGI-level suites (test_host_app.py, test_host_concurrency.py)
        # actually run here. With only requirements-dev.txt they would be
        # *silently skipped* by importorskip -- a green job proving nothing.
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt -r host/requirements-dev.txt

      - name: Run host service tests
        run: pytest tests/test_host_service.py tests/test_host_client.py -v

      - name: Run ASGI-level host suites
        # These need fastapi/httpx/a2wsgi, so they belong to this job and not
        # to the dependency-light one above. test_audit_fixes.py in particular
        # is the regression pin for the whole host remediation list, and it
        # used to be excluded from every job's explicit file list -- it only
        # ran in the `test` job, where importorskip silently skipped it.
        run: >-
          pytest tests/test_host_app.py tests/test_host_metrics.py
          tests/test_host_docs.py tests/test_audit_fixes.py
          tests/test_passenger_wsgi.py -v

      - name: Run 50-client concurrency suite
        # The load and soak tests are opt-in via environment variables and
        # are skipped here by design: they must never run in CI.
        run: pytest tests/test_host_concurrency.py tests/test_session_concurrency.py -v

  windows-check:
    name: Windows platform checks
    runs-on: windows-latest
    # DPAPI, the named mutex and the SendInput injection backend cannot be
    # exercised on Linux. This job runs them on a real Windows runner; it is
    # the only place where those code paths are verified automatically.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Windows runners cannot be debugged from a Linux checkout, so both
      # steps below surface their failure lines as GitHub annotations: the
      # reason is visible in the PR's Checks tab, not buried in a log.
      - name: Platform tests (mutex, secret store, injection, selftest script)
        shell: pwsh
        run: |
          python -m pytest tests/test_session_lifecycle.py tests/test_secret_store.py `
            tests/test_injection.py tests/test_windows_selftest.py `
            tests/test_shutdown_flow.py -q --tb=line > pytest-windows.log 2>&1
          $code = $LASTEXITCODE
          Get-Content pytest-windows.log | Write-Host
          if ($code -ne 0) {
            Select-String -Path pytest-windows.log -Pattern '^(FAILED|ERROR|.*Error:)' |
              Select-Object -First 10 |
              ForEach-Object { Write-Host "::error title=Windows tests::$($_.Line)" }
          }
          exit $code

      - name: Windows component self-test (DPAPI + mutex + SendInput)
        shell: pwsh
        run: |
          python scripts/windows_selftest.py > windows-selftest.log 2>&1
          $code = $LASTEXITCODE
          Get-Content windows-selftest.log | Write-Host
          if ($code -ne 0) {
            Get-Content windows-selftest.log | Select-Object -First 10 |
              ForEach-Object { Write-Host "::error title=Windows self-test::$($_)" }
          }
          exit $code

  dependency-audit:
    name: Dependency audit (known CVEs)
    runs-on: ubuntu-latest
    # Advisories are published after a dependency is pinned, so a green build
    # yesterday says nothing about today. This job resolves both requirement
    # files (client and host) against the advisory database on every push.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip && pip install "pip-audit>=2.7,<3.0"

      - name: Audit client + host dependencies
        run: pip-audit -r requirements.txt -r host/requirements.txt --strict

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan working tree and history (project scanner)
        # Fails on any finding that is not a documented, fingerprinted entry
        # in scripts/secret_scan_baseline.txt. Accepted findings are printed
        # on every run; nothing is silently ignored.
        run: |
          python3 scripts/scan_secrets.py
          python3 scripts/scan_secrets.py --history
