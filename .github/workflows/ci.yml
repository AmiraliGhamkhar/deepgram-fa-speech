name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# No real Deepgram credentials are used anywhere in this workflow. All
# provider/network interaction is mocked (see tests/test_streaming.py,
# tests/test_app.py) so the test suite never opens a real connection.
env:
  DEEPGRAM_API_KEY: ""

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system audio dependency (for sounddevice import)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit + regression tests
        run: pytest tests/ -v --cov=medical_stt --cov-report=term-missing

      - name: Lint (ruff)
        run: ruff check medical_stt tests scripts host

      - name: Type check (mypy)
        run: mypy medical_stt host/core.py

  host-test:
    name: Host service tests
    runs-on: ubuntu-latest
    # Proves host/core.py's auth, rate limiting, TTL clamping and Deepgram
    # grant logic. No Deepgram key and no network access are required.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run host service tests
        run: pytest tests/test_host_service.py tests/test_host_client.py -v

  windows-check:
    name: Windows platform checks
    runs-on: windows-latest
    # DPAPI, the named mutex and the SendInput injection backend cannot be
    # exercised on Linux. This job runs them on a real Windows runner; it is
    # the only place where those code paths are verified automatically.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Platform tests (mutex, secret store, injection, selftest script)
        run: >
          pytest tests/test_session_lifecycle.py tests/test_secret_store.py
          tests/test_injection.py tests/test_windows_selftest.py
          tests/test_shutdown_flow.py -q

      - name: Windows component self-test (DPAPI + mutex + SendInput)
        run: python scripts/windows_selftest.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan working tree and history (project scanner)
        # Fails on any finding that is not a documented, fingerprinted entry
        # in scripts/secret_scan_baseline.txt. Accepted findings are printed
        # on every run; nothing is silently ignored.
        run: |
          python3 scripts/scan_secrets.py
          python3 scripts/scan_secrets.py --history
