[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Keep the linted rule set focused on real correctness issues (unused
# imports/variables, undefined names, obvious bugs) rather than the full
# opinionated style rule set, per "do not add unnecessary frameworks" /
# keep the project lightweight.
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["tests/", "scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
