# Runtime settings (override sensitive values via .env)

model: nova-3
language: fa
sample_rate: 16000
channels: 1
block_duration: 0.08
endpointing: 400
utterance_end_ms: 1200   # Deepgram accepts 1000-5000

# Deepgram region the audio is streamed to: us (default), eu, au or in.
# Session tokens from the host are valid on every region; choose the closest
# one, or the one your data-residency rules require. Concurrency limits are
# per Deepgram project and do not change with the region.
deepgram_region: us
# Opt the audio out of Deepgram's Model Improvement Program. false is
# Deepgram's default; true is billed at a higher per-minute rate. Decide this
# explicitly for clinical audio and record the decision.
mip_opt_out: false

# --- Host (the only place the Deepgram API key exists) -------------------
# The desktop app has NO Deepgram API key. It authenticates to your
# self-hosted service with a shared secret (entered in the app, stored
# with Windows DPAPI) and receives a short-lived session token.
#
# host_url must be https://. Plain http:// is accepted only for localhost
# development.
host_url: "https://stt.example.com"
# Identifies *which* device is talking to the host, so the host can rate limit
# per clinician instead of per hospital NAT address, and so one compromised
# device can be revoked without re-provisioning the whole clinic. Not a
# credential -- the secret stays in the DPAPI-protected store -- which is why
# it is safe to keep here. Issued per device by `python -m host.provision`
# (see host/README.md). Required whenever the host is configured with a client
# registry, which is the supported setup for more than one clinician.
# Per-machine override: MEDICALSTT_HOST_CLIENT_ID.
# Grammar: 1-64 ASCII characters of letters, digits, '-', '_' or '.', with at
# least one letter or digit; anything else is a configuration error here
# because the host would refuse to load it into its registry.
host_client_id: ""
host_timeout_seconds: 10.0
# The session token only has to outlive the WebSocket handshake; 30s is
# Deepgram's own default.
session_ttl_seconds: 30

# paste = clipboard + Ctrl+V (best for RTL/Persian shaping)
# type  = Unicode key events character-by-character
inject_mode: paste
paste_settle_seconds: 0.12
restore_clipboard: true

overlay_enabled: true

# Reconnection (exponential backoff with bounded jitter; auth/config
# errors are never retried regardless of these settings)
reconnect_delay: 2.0
max_reconnect_attempts: 0   # 0 = unlimited
reconnect_backoff_max: 30.0
reconnect_jitter: 0.5       # fraction below the computed ceiling (full negative jitter), e.g. 0.5 = up to 50% below the computed ceiling

# Terminology safety: "context_dependent" rules map a common standalone
# word to an abbreviation (e.g. "نبض" -> "HR") and are disabled by default
# because they can misfire on ordinary speech. Enable only if you have
# reviewed data/corrections.yaml and accept the risk.
enable_context_dependent_terms: false

# Deepgram recognition hints: general terms are always loaded, followed by
# the selected specialty's focused terms.
specialty: general

# Low-confidence high-risk tokens are protected by character span (not by
# disabling the whole terminology pass) and exposed as warnings. If a token
# cannot be aligned to the transcript, the whole utterance is preserved.
medical_confidence_threshold: 0.65

# Apply only the explicit provider-side substitutions in data/asr_replacements.yaml.
use_asr_replacements: true
