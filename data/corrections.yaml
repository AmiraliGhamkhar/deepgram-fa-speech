# Medical correction rules for the terminology engine (deterministic
# longest-match, left-to-right; see medical_stt/processing/fst.py).
#
# Schema (one entry per rule):
#   from:              source Persian/English phrase as it may be dictated
#   to:                normalized/target text
#   category:          one of
#       safe_lexical            - pure spelling/formatting normalization,
#                                  meaning cannot change (e.g. spacing
#                                  variants of the same word)
#       abbreviation_expansion   - the physician spelled out an abbreviation
#                                  letter-by-letter ("آی سی یو" = I-C-U);
#                                  low ambiguity
#       specialty_terminology    - multi-word or unambiguous specialty term
#                                  / procedure / anatomy phrase
#       context_dependent        - single ordinary word or short phrase
#                                  whose "abbreviation" could also be a
#                                  common word in unrelated speech; NOT
#                                  applied unless the caller explicitly
#                                  enables context-dependent rules
#       unsafe                   - can flip clinical meaning (e.g. turning
#                                  a generic word into a directive
#                                  abbreviation without context); disabled
#                                  by default, kept only for documentation
#   confidence:        high | medium | low - engine's trust in the mapping
#   requires_context:  true if this rule should only fire when the caller
#                       opts in (see TerminologyEngine(enable_context_dependent=...))
#   dangerous:         true if the rule must never be applied automatically
#
# Regenerated from the legacy flat from/to list by
# scripts/classify_corrections.py (see that file for the classification
# heuristics and rationale). Manual review is still recommended before
# adding new "specialty_terminology" or "context_dependent" entries.
#
